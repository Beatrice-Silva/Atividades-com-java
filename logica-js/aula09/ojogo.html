<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O jogo de adivinhacao</title>
</head>
<body>
    <main>

        <h1>O jogo</h1>
        <h2>
            A seguir segue-se um jogo de adivinhação, um número alatório
            sera escolhido e o usuário deve adivinhar-lo baseado 
            nas respostas de acordo com o quão perto do nívl de acerto estiver:
            'Maior' ou 'Menor'.
        </h2>

        <label for="enunciado">Siga com 'sim' quando desejar que 
            comece o jogo com
            o número aleatório escolhido.
        </label>

        <button id="sortear">Sortear e Começar</button>
        
        <label for="questao">Adivinhe a seguir:</label>
        <input id="questao" placeholder="...">

        <button id="botao2">Adivinhar</button>

        <p id="resultado" class="adivinhar">Quão perto...</p>
        

        
    <p><a href="../index.html">Voltar para a lista</a></p>
    </main>

    
    <script src="js/ojogo.js"></script>
</body>
</html>
